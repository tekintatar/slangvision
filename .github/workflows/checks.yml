# GPU-free checks on every push to main and every pull request. Hosted
# runners have no NVIDIA GPU, so the CUDA tests remain a manual step on a GPU
# host (scripts/cuda_box/); see CONTRIBUTING.md.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-gpu:
    name: Lint, types, GPU-free tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # the oldest and newest supported Python; breakage rarely shows only in between
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # uv unpacks torch in a few seconds; pip took about 20
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install
        id: install
        run: |
          # CPU wheels: the GPU-free tests never touch CUDA
          uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -e ".[dev]"
          echo "versions=$(python -c 'import mypy.version, torch; print(mypy.version.__version__ + "-" + torch.__version__)')" >> "$GITHUB_OUTPUT"
      # mypy spends most of its time analysing torch; keep its cache between runs
      - uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ matrix.python }}-${{ steps.install.outputs.versions }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: mypy-${{ matrix.python }}-${{ steps.install.outputs.versions }}-
      - name: Check (whitespace, ruff, mypy, pytest -m "not gpu")
        run: scripts/check.sh --no-gpu -ra
      - name: Shell scripts
        run: shellcheck scripts/check.sh scripts/cuda_box/*.sh

  package:
    name: Build and check the wheel and sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build (reproducible)
        run: |
          python -m pip install build==1.4.0 twine==7.0.0
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -m build
      - name: Check archives
        run: twine check dist/*
