# Publishes the wheel and sdist to PyPI when a version tag (v*) is pushed,
# through PyPI trusted publishing: no API token is stored anywhere. PyPI must
# list this repository's `publish.yml` workflow and `pypi` environment as a
# trusted publisher. A manual run only builds and checks the archives.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the release archives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - name: Build and check
        run: |
          python -m pip install build==1.4.0 twine==7.0.0
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -m build
          twine check dist/*
          sha256sum dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/slangvision/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
